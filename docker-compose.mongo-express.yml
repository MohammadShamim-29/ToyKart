services:
  mongo-express:
    image: mongo-express:latest
    container_name: toykart-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Example: mongodb://root:secret@host.docker.internal:27017/?authSource=admin
      ME_CONFIG_MONGODB_URL: ${ME_CONFIG_MONGODB_URL:-mongodb://host.docker.internal:27017/}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD:-admin123}
      ME_CONFIG_OPTIONS_EDITORTHEME: ${ME_CONFIG_OPTIONS_EDITORTHEME:-dracula}
      ME_CONFIG_SITE_BASEURL: /
      VCAP_APP_HOST: 0.0.0.0
      VCAP_APP_PORT: 8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
